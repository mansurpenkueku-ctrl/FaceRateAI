<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812"><title>FaceRate AI Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#080812;color:#f4f2ff;font:15px system-ui}.wrap{max-width:940px;margin:auto;padding:20px}.card{background:#141428;border:1px solid #302d50;border-radius:17px;padding:18px;margin:14px 0}input,select{display:block;width:100%;background:#0b0b19;color:white;border:1px solid #393653;border-radius:10px;padding:12px;margin:8px 0}button{background:linear-gradient(110deg,#8057e9,#347fbd);border:0;color:white;border-radius:10px;padding:12px 16px;margin:5px;cursor:pointer;font-weight:700}.danger{background:#64283e}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.muted{color:#aaa8c4;white-space:pre-wrap}.hidden{display:none!important}.user{padding:13px 0;border-bottom:1px solid #33314c}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>FaceRate AI · Admin</h1><p class="muted">Админ-панель встроена в сайт. Доступ проверяется серверной функцией.</p>
<section id="login" class="card"><h2>Вход администратора</h2><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Войти</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="hidden"><div class="card"><h2>Выдача Premium / Full Version</h2><input id="target" placeholder="Email пользователя"><div class="grid"><select id="plan"><option value="premium">Premium</option><option value="full">Full Version</option></select><select id="days"><option value="30">30 дней</option><option value="90">90 дней</option><option value="365">365 дней</option><option value="lifetime">Навсегда</option></select><button onclick="grant()">Выдать доступ</button></div><p id="actionMsg" class="muted"></p></div><div class="card"><h2>Пользователи</h2><div class="grid"><input id="q" placeholder="Поиск по email"><button onclick="loadUsers()">Найти</button><button onclick="loadUsers(true)">Все</button></div><div id="users"></div></div><button onclick="logout()">Выйти</button></section></div>
<script>
async function call(path,data,method="POST"){const r=await fetch("/.netlify/functions/api/"+path,{method,headers:{"Content-Type":"application/json"},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"Ошибка");return j}
async function login(){try{await call("admin-login",{email:email.value,password:password.value});document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");loadUsers(true)}catch(e){loginMsg.textContent=e.message}}
async function grant(){try{await call("grant",{email:target.value,plan:plan.value,days:days.value});actionMsg.textContent="Доступ выдан.";loadUsers()}catch(e){actionMsg.textContent=e.message}}
async function revoke(mail){if(!confirm("Отозвать доступ у "+mail+"?"))return;try{await call("revoke",{email:mail});loadUsers()}catch(e){alert(e.message)}}
async function loadUsers(all){try{const r=await call("users"+(all?"":"?q="+encodeURIComponent(q.value)),null,"GET");users.innerHTML=r.users.map(u=>`<div class="user"><b>${esc(u.email)}</b><div class="muted">Тариф: ${u.entitlement.plan} · срок: ${u.entitlement.expiresAt||"—"}</div><button class="danger" onclick="revoke('${esc(u.email)}')">Отозвать доступ</button></div>`).join("")||"Пользователей нет"}catch(e){users.textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function logout(){await call("logout",{});location.reload()}
</script></body></html>
